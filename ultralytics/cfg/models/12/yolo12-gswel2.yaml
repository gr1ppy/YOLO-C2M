# YOLO12 object detection model with P3/8 - P5/32 outputs
# Model docs: https://docs.ultralytics.com/models/yolo12
# Task docs: https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 6 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolo12n.yaml' will call yolo12.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.25, 0.25, 1024] # summary: 272 layers, 2,602,288 parameters, 2,602,272 gradients, 6.7 GFLOPs
  s: [0.50, 0.50, 1024] # summary: 272 layers, 9,284,096 parameters, 9,284,080 gradients, 21.7 GFLOPs
  m: [0.50, 1.00, 512] # summary: 292 layers, 20,199,168 parameters, 20,199,152 gradients, 68.1 GFLOPs
  l: [1.00, 1.00, 512] # summary: 488 layers, 26,450,784 parameters, 26,450,768 gradients, 89.7 GFLOPs
  x: [1.00, 1.50, 512] # summary: 488 layers, 59,210,784 parameters, 59,210,768 gradients, 200.3 GFLOPs

# YOLO12n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, GaborConvMax, [64, 3, 8, [0.1], 0.5, 10.0, 0.0, False, True, "max"]]
  - [-1, 1, SubtractiveDownsample2, [128]] # 1-P2/4
  - [-1, 1, CG2faltL, [256, 2]]
  - [-1, 1, SubtractiveDownsample2, [256]] # 3-P3/8
  - [-1, 1, CG2faltL, [512, 2]]
  - [-1, 1, SubtractiveDownsample2, [512]] # 5-P4/16
  - [-1, 1, CG2faltL, [512, 2]]
  - [-1, 1, SubtractiveDownsample2, [1024]] # 7-P5/32
  - [-1, 1, CG2faltL, [1024, 2]] # 8

# YOLO12n head
head:
  - [-1, 1, GhostConv, [512, 1, 1]] # 7-P5/32
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 7], 1, Concat, [1]] # cat backbone P4
  - [-1, 1, CG2faltL, [512]] # 11

  - [-1, 1, GhostConv, [256, 1, 1]] # 7-P5/32
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 5], 1, Concat, [1]] # cat backbone P3
  - [-1, 1, CG2faltL, [256]] # 14

  - [-1, 1, GhostConv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]] # cat head P4
  - [-1, 1, CG2faltL, [512]] # 17

  - [-1, 1, GhostConv, [512, 3, 2]]
  - [[-1, 9], 1, Concat, [1]] # cat head P5
  - [-1, 1, CG2faltL, [1024]] # 20 (P5/32-large)

  - [[17, 20, 23], 1, Detect, [nc]] # Detect(P3, P4, P5)