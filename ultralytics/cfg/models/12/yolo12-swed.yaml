# Ultralytics YOLOv5 object detection model with P3/8 - P5/32 outputs
# Model docs: https://docs.ultralytics.com/models/yolov5
# Task docs: https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 6 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolov5n.yaml' will call yolov5.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [1.00, 1.00, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 1024]
  l: [1.00, 1.00, 1024]
  x: [1.33, 1.25, 1024]

# YOLOv5 v6.0 backbone
backbone:
  # [from, number, module, args]
  - [-1, 1, Conv, [16, 3, 2]] # 0-P1/2
  - [-1, 1, GhostConv, [32, 3, 2]] # 2-P2/4
  - [-1, 1, CG2, [32]]
  - [-1, 1, GhostConv, [64, 3, 2]] # 4-P3/8
  - [-1, 1, CG2, [64]]
  - [-1, 1, GhostConv, [128, 3, 2]] # 6-P4/16
  - [-1, 1, CG2, [128]]
  - [-1, 1, GhostConv, [256, 3, 2]] # 8-P5/32
  - [-1, 1, CG2, [256]]
  - [-1, 1, ATPF, [256, 5]] # 10

# YOLOv5 v6.0 head
head:
  - [-1, 1, GhostConv, [128, 1, 1]]
  - [-1, 1, CARAFE, [128, 128]]
  - [[-1, 6], 1, Concat, [1]]  # cat backbone P4
  - [-1, 1, CG2, [128]] # 14

  - [-1, 1, GhostConv, [64, 1, 1]]  
  - [-1, 1, CARAFE, [64, 64]]
  - [[-1, 4], 1,  Concat, [1]] # cat backbone P3
  - [-1, 1, DeformableConvBlock, [64]] # 18 (P3/8-small)

  - [-1, 1, GhostConv, [64, 3, 2]]
  - [[-1, 14], 1, Concat, [1]] # cat head P4
  - [-1, 1, DeformableConvBlock, [128]] # 21 (P4/16-medium)

  - [-1, 1, GhostConv, [128, 3, 2]]
  - [[-1, 10], 1, Concat, [1]] # cat head P5
  - [-1, 1, DeformableConvBlock, [256]] # 24 (P5/32-large)

  - [[17, 20, 23], 1, Detect, [nc]] # Detect(P3, P4, P5)

